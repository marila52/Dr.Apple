name: dr_apple
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5

  # Локальная база данных
  sqflite: ^2.4.2
  path: ^1.9.1
  sqflite_common_ffi: ^2.3.4

  # Для работы с файлами
  path_provider: ^2.1.5

  # Управление состоянием
  provider: ^6.1.2

  # Для HTTP запросов
  http: ^1.3.0

  # Для графиков
  fl_chart: ^0.70.2

  # Для безопасного хранения
  flutter_secure_storage: ^9.2.4

  # Для кэширования изображений
  cached_network_image: ^3.4.1

  # Сканер штрих-кодов
  mobile_scanner: ^6.0.2

  # DIO для повторных попыток
  dio: ^5.7.0
  dio_smart_retry: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Иконка приложения
  flutter_launcher_icons: ^0.14.3

  # Splash screen
  flutter_native_splash: ^2.4.1

# =========================
# APP ICON
# =========================

flutter_launcher_icons:
  android: true
  ios: false

  image_path: "assets/icon/app_icon.png"

  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

  adaptive_icon_foreground_inset: 0

  min_sdk_android: 21


# =========================
# FLUTTER
# =========================

flutter:
  uses-material-design: true
  fonts:
    - family: Prata
      fonts:
        - asset: assets/fonts/Prata-Regular.ttf

  assets:
    - assets/images/dr_apple_logo.png
    - assets/images/dr_apple_2_screen.png
    - assets/images/dr_apple_reg.png
    - assets/images/dr_apple_create_acc.png
    - assets/images/Mr Noisy.png
    - assets/images/Mr Lazy.png
    - assets/images/Frame 2.png
    - assets/images/womansign.png
    - assets/images/mansign.png
    - assets/images/sexguy.png
    - assets/images/weightguy.png
    - assets/images/heightguy.png
    - assets/images/ageguy.png
    - assets/images/image54.png
    - assets/images/image54.png
    - assets/icon/app_icon.png
    - assets/images/kl.png
    - assets/images/go.png
    - assets/images/ej.png
    - assets/images/settings.jpg
    - assets/images/up.png